<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>转角的路灯 · vlog小站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2ea;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #3a4a3c;
            line-height: 1.4;
            padding: 32px 24px 64px;
        }

        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            background: rgba(240, 245, 235, 0.7);
            border-radius: 2.5rem;
            backdrop-filter: blur(2px);
            padding: 32px 28px;
            box-shadow: 0 8px 30px rgba(80, 70, 50, 0.04);
        }

        .page {
            transition: all 0.2s ease;
        }

        .hidden-page {
            display: none;
        }

        .btn-soft {
            background: #e6ece2cc;
            backdrop-filter: blur(4px);
            border: 1px solid #d0dec6;
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #5a6b55;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-soft:hover {
            background: #edf3e6;
            border-color: #bfcfb2;
            color: #3a5538;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #dce6d4;
            border: 1px solid #c8d6bc;
            color: #4d6048;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #d1dfc5;
            border-color: #b7caa6;
        }

        .hero {
            text-align: center;
            margin-bottom: 48px;
        }

        /* 手写体，无圆角边框背景 */
        .hero p {
            font-family: 'KaiTi', '华文行书', 'ZCOOL KuaiLe', 'cursive', 'Segoe UI Emoji';
            font-size: 1.35rem;
            color: #7c8f73;
            letter-spacing: 1px;
            font-weight: 400;
            display: inline-block;
            background: none;
            padding: 0;
            border-radius: 0;
            backdrop-filter: none;
            box-shadow: none;
        }

        .nav-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 32px;
        }

        .vlog-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
        }

        .video-card {
            background: #fafcf7dd;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 12px 26px -12px rgba(70, 60, 40, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #dee9d4;
            width: 100%;
            max-width: 860px;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 32px -16px rgba(70, 60, 40, 0.12);
            background: #fefffaf2;
        }

        .video-wrapper {
            background: #2c3e2b;
            position: relative;
        }

        video {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            outline: none;
        }

        .card-content {
            padding: 16px 20px 20px;
        }

        .video-title {
            font-weight: 600;
            font-size: 1.2rem;
            color: #4a6243;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quality-selector {
            background: #eef2e8;
            border-radius: 48px;
            padding: 4px 12px;
            font-size: 0.75rem;
            border: none;
            font-family: inherit;
            font-weight: 500;
            color: #6f8366;
            cursor: pointer;
        }

        /* 后台管理样式 */
        .admin-panel {
            max-width: 900px;
            margin: 0 auto;
            background: #fafcf7db;
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 32px 28px;
            border: 1px solid #e0ebd4;
        }

        .admin-title {
            font-size: 1.7rem;
            font-weight: 480;
            margin-bottom: 24px;
            color: #6b7f60;
            border-left: 4px solid #c2d4b0;
            padding-left: 16px;
        }

        .upload-area, .manage-area {
            background: #f6faf0;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 32px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .input-group label {
            font-weight: 500;
            color: #7c8f6e;
            font-size: 0.9rem;
        }

        input, .file-label, select {
            background: #fefff9;
            border: 1px solid #d7e2ca;
            border-radius: 48px;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            color: #3e5636;
        }

        input:focus {
            border-color: #bfd6ab;
            box-shadow: 0 0 0 2px rgba(167, 192, 132, 0.2);
        }

        .upload-btn, .edit-save {
            background: #d7e5ca;
            border: none;
            color: #4c6940;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
        }

        .message {
            font-size: 0.85rem;
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 60px;
            background: #eef3e6;
            color: #70855f;
        }

        hr {
            margin: 24px 0;
            border: none;
            height: 1px;
            background: #e0ebd4;
        }

        /* vlog 管理表格样式 */
        .vlog-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vlog-item {
            background: #ffffffcc;
            border-radius: 24px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid #dee9d4;
        }

        .vlog-info {
            flex: 3;
            min-width: 150px;
        }

        .vlog-title {
            font-weight: 600;
            color: #4a6243;
        }

        .vlog-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .small-btn {
            background: #eef2e8;
            border: 1px solid #cbdcc0;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
            color: #5a6b55;
        }

        .small-btn.danger {
            background: #f3eee8;
            border-color: #e0cfc0;
            color: #aa7c58;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(60, 60, 50, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fefff9;
            border-radius: 2rem;
            max-width: 500px;
            width: 90%;
            padding: 28px;
            border: 1px solid #e0ebd4;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.15);
        }

        footer {
            text-align: center;
            margin-top: 56px;
            font-size: 0.75rem;
            color: #b1c2a3;
        }

        @media (max-width: 720px) {
            body { padding: 16px; }
            .app-container { padding: 20px 16px; }
            .vlog-item { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="nav-buttons">
        <button id="gotoFrontBtn" class="btn-soft">✨ 展示小站</button>
        <button id="gotoBackBtn" class="btn-soft">📀 进入后台</button>
    </div>

    <!-- 展示页面 -->
    <div id="frontPage" class="page">
        <div class="hero">
            <p>Hello~ 欢迎来到转角的路灯的vlog小站！</p>
        </div>
        <div id="vlogGridContainer" class="vlog-grid">
            <div class="loading-placeholder" style="text-align:center; padding: 48px; color:#a6bc97;">✨ 正在加载温暖的vlog...</div>
        </div>
        <footer>© 转角的路灯 · 用影像记录街角的故事</footer>
    </div>

    <!-- 后台页面 -->
    <div id="backPage" class="page hidden-page">
        <div class="admin-panel" id="adminPanel"></div>
        <footer style="margin-top: 48px;">后台管理 · 仅限光影守护者</footer>
    </div>
</div>

<script>
    // ---------- IndexedDB 配置 ----------
    const DB_NAME = 'LampVlogDB';
    const DB_VERSION = 5;   // 增加字段 coverBlob, sortOrder
    const STORE_VLOGS = 'vlogs';

    let db = null;
    let currentEditVlog = null; // 编辑模态框临时存储

    // 打开数据库
    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };
            request.onupgradeneeded = (event) => {
                const database = event.target.result;
                if (!database.objectStoreNames.contains(STORE_VLOGS)) {
                    const store = database.createObjectStore(STORE_VLOGS, { keyPath: 'id' });
                    store.createIndex('sortOrder', 'sortOrder', { unique: false });
                } else {
                    const store = event.target.transaction.objectStore(STORE_VLOGS);
                    if (!store.indexNames.contains('sortOrder')) {
                        store.createIndex('sortOrder', 'sortOrder', { unique: false });
                    }
                }
                // 清除所有 external 假数据
                const tx = event.target.transaction;
                const store = tx.objectStore(STORE_VLOGS);
                const getAll = store.getAll();
                getAll.onsuccess = () => {
                    const items = getAll.result || [];
                    for (const item of items) {
                        if (item.type === 'external') store.delete(item.id);
                        else {
                            // 给旧数据补充字段
                            if (item.sortOrder === undefined) item.sortOrder = item.createdAt;
                            if (item.coverBlob === undefined) item.coverBlob = null;
                            store.put(item);
                        }
                    }
                };
            };
        });
    }

    // 获取所有内部vlog（按 sortOrder 升序，数字小的在前）
    async function getAllVlogs() {
        const tx = db.transaction(STORE_VLOGS, 'readonly');
        const store = tx.objectStore(STORE_VLOGS);
        const index = store.index('sortOrder');
        const request = index.getAll();
        return new Promise((resolve) => {
            request.onsuccess = () => {
                let items = request.result || [];
                items = items.filter(item => item.type !== 'external');
                items.sort((a, b) => (a.sortOrder || a.createdAt) - (b.sortOrder || b.createdAt));
                resolve(items);
            };
            request.onerror = () => resolve([]);
        });
    }

    // 添加新vlog (视频+封面可选)
    async function addNewVlog(title, videoFile, coverFile) {
        return new Promise(async (resolve, reject) => {
            try {
                const videoBlob = videoFile ? await fileToBlob(videoFile) : null;
                let coverBlob = null;
                if (coverFile) coverBlob = await fileToBlob(coverFile);
                const id = 'vlog_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
                // 获取当前最大 sortOrder，新加的顺序放在最前面（最小值=0）
                const all = await getAllVlogs();
                const minOrder = all.length > 0 ? Math.min(...all.map(v => v.sortOrder ?? v.createdAt)) : 0;
                const newOrder = minOrder - 1;  // 新视频成为第一个
                const newVlog = {
                    id: id,
                    title: title || '新·转角随拍',
                    createdAt: Date.now(),
                    type: 'internal',
                    videoBlob: videoBlob,
                    coverBlob: coverBlob,
                    sortOrder: newOrder
                };
                const tx = db.transaction(STORE_VLOGS, 'readwrite');
                const store = tx.objectStore(STORE_VLOGS);
                store.put(newVlog);
                tx.oncomplete = () => resolve(newVlog);
                tx.onerror = (err) => reject(err);
            } catch (err) { reject(err); }
        });
    }

    // 更新vlog (部分字段)
    async function updateVlog(vlogId, updates) {
        const tx = db.transaction(STORE_VLOGS, 'readwrite');
        const store = tx.objectStore(STORE_VLOGS);
        const vlog = await new Promise((resolve) => {
            const req = store.get(vlogId);
            req.onsuccess = () => resolve(req.result);
        });
        if (!vlog) return;
        Object.assign(vlog, updates);
        store.put(vlog);
        return new Promise(resolve => { tx.oncomplete = resolve; });
    }

    // 删除vlog
    async function deleteVlog(vlogId) {
        const tx = db.transaction(STORE_VLOGS, 'readwrite');
        const store = tx.objectStore(STORE_VLOGS);
        store.delete(vlogId);
        return new Promise(resolve => { tx.oncomplete = resolve; });
    }

    // 调整排序: 移动方向 'up' 或 'down'
    async function reorderVlog(vlogId, direction) {
        const all = await getAllVlogs();
        const idx = all.findIndex(v => v.id === vlogId);
        if (idx === -1) return;
        if (direction === 'up' && idx > 0) {
            [all[idx].sortOrder, all[idx-1].sortOrder] = [all[idx-1].sortOrder, all[idx].sortOrder];
        } else if (direction === 'down' && idx < all.length-1) {
            [all[idx].sortOrder, all[idx+1].sortOrder] = [all[idx+1].sortOrder, all[idx].sortOrder];
        } else return;
        const tx = db.transaction(STORE_VLOGS, 'readwrite');
        const store = tx.objectStore(STORE_VLOGS);
        all.forEach(v => store.put(v));
        return new Promise(resolve => { tx.oncomplete = resolve; });
    }

    function fileToBlob(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => fetch(e.target.result).then(r => r.blob()).then(resolve);
            reader.readAsDataURL(file);
        });
    }

    // 生成 blob url (视频或封面)
    function getBlobURL(blob) {
        return blob ? URL.createObjectURL(blob) : null;
    }

    // ---------- 渲染展示页面 (带封面poster) ----------
    async function renderFrontPage() {
        const container = document.getElementById('vlogGridContainer');
        if (!container) return;
        const vlogs = await getAllVlogs();
        if (!vlogs.length) {
            container.innerHTML = '<div style="text-align:center; padding:48px; color:#b1cf9c;">✨ 暂时还没有vlog，去后台传一个吧~</div>';
            return;
        }
        let html = '';
        for (let v of vlogs) {
            const videoUrl = v.videoBlob ? URL.createObjectURL(v.videoBlob) : '';
            const posterUrl = v.coverBlob ? URL.createObjectURL(v.coverBlob) : '';
            html += `
                <div class="video-card" data-vid="${v.id}">
                    <div class="video-wrapper">
                        <video id="video_${v.id}" controls preload="metadata" poster="${posterUrl}" controlslist="nodownload" style="width:100%; aspect-ratio:16/9;">
                            <source src="${videoUrl}" type="video/mp4">
                            您的浏览器不支持视频播放
                        </video>
                    </div>
                    <div class="card-content">
                        <div class="video-title">
                            <span>📽️ ${escapeHtml(v.title)}</span>
                            <select class="quality-selector" data-vid="${v.id}">
                                <option value="low">🌿 流畅清晰</option>
                                <option value="high">✨ 高清画质</option>
                            </select>
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        // 清晰度切换（内部视频仅同一源，保持交互）
        for (let v of vlogs) {
            const selector = document.querySelector(`.quality-selector[data-vid="${v.id}"]`);
            const videoElem = document.getElementById(`video_${v.id}`);
            if (selector && videoElem) {
                selector.addEventListener('change', () => {
                    const wasPlaying = !videoElem.paused;
                    videoElem.load();
                    if (wasPlaying) videoElem.play().catch(e=>console.log);
                });
            }
        }
    }

    // ---------- 后台管理模块 ----------
    async function renderBackPage() {
        const adminContainer = document.getElementById('adminPanel');
        if (!adminContainer) return;
        const isLogged = sessionStorage.getItem('lamp_admin_auth') === 'authenticated';
        if (!isLogged) {
            adminContainer.innerHTML = `
                <div class="admin-title">🔐 守护者验证</div>
                <div class="login-form">
                    <div class="input-group">
                        <label>🔑 后台密码</label>
                        <input type="password" id="adminPassword" placeholder="请输入密码" autocomplete="off">
                    </div>
                    <button id="loginBtn" class="btn-soft btn-primary">✨ 进入光影工作室</button>
                    <div class="message" id="loginMsg"></div>
                </div>
            `;
            const loginBtn = document.getElementById('loginBtn');
            const pwdInput = document.getElementById('adminPassword');
            const msgDiv = document.getElementById('loginMsg');
            const handleLogin = () => {
                if (pwdInput.value === '666') {
                    sessionStorage.setItem('lamp_admin_auth', 'authenticated');
                    renderBackPage();
                } else {
                    if (msgDiv) msgDiv.innerText = '❌ 密码错误';
                }
            };
            loginBtn?.addEventListener('click', handleLogin);
            pwdInput?.addEventListener('keypress', e => e.key === 'Enter' && handleLogin());
            return;
        }
        // 已登录: 上传表单 + 管理列表
        const vlogs = await getAllVlogs();
        adminContainer.innerHTML = `
            <div class="admin-title">📹 上传新vlog</div>
            <div class="upload-area">
                <div class="input-group"><label>🎬 标题</label><input type="text" id="newTitle" placeholder="标题"></div>
                <div class="input-group"><label>🎥 视频文件 (MP4)</label><input type="file" id="newVideo" accept="video/mp4"></div>
                <div class="input-group"><label>🖼️ 视频封面 (图片, 比例16:9)</label><input type="file" id="newCover" accept="image/jpeg,image/png,image/webp"></div>
                <button id="uploadBtn" class="btn-soft btn-primary upload-btn">⬆️ 上传发布</button>
                <div id="uploadMsg" class="message"></div>
            </div>
            <div class="manage-area">
                <div class="admin-title" style="font-size:1.4rem;">📋 vlog管理 (可排序/编辑/删除)</div>
                <div id="vlogManageList" class="vlog-list"></div>
            </div>
            <div style="display:flex; justify-content:flex-end;"><button id="logoutBackBtn" class="btn-soft">🚪 退出后台</button></div>
        `;
        // 渲染管理列表
        const manageListDiv = document.getElementById('vlogManageList');
        if (manageListDiv) {
            manageListDiv.innerHTML = vlogs.map((v, idx) => `
                <div class="vlog-item" data-id="${v.id}">
                    <div class="vlog-info"><span class="vlog-title">${escapeHtml(v.title)}</span><br><small style="color:#8faa7a;">排序索引: ${v.sortOrder ?? v.createdAt}</small></div>
                    <div class="vlog-actions">
                        <button class="small-btn edit-vlog" data-id="${v.id}">✏️ 编辑</button>
                        <button class="small-btn move-up" data-id="${v.id}" ${idx===0 ? 'disabled style="opacity:0.5"' : ''}>⬆️ 上移</button>
                        <button class="small-btn move-down" data-id="${v.id}" ${idx===vlogs.length-1 ? 'disabled style="opacity:0.5"' : ''}>⬇️ 下移</button>
                        <button class="small-btn danger delete-vlog" data-id="${v.id}">🗑️ 删除</button>
                    </div>
                </div>
            `).join('');
            // 绑定管理事件
            document.querySelectorAll('.edit-vlog').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.dataset.id)));
            document.querySelectorAll('.move-up').forEach(btn => btn.addEventListener('click', async () => {
                if (btn.disabled) return;
                await reorderVlog(btn.dataset.id, 'up');
                await renderBackPage();
                await renderFrontPage();
            }));
            document.querySelectorAll('.move-down').forEach(btn => btn.addEventListener('click', async () => {
                if (btn.disabled) return;
                await reorderVlog(btn.dataset.id, 'down');
                await renderBackPage();
                await renderFrontPage();
            }));
            document.querySelectorAll('.delete-vlog').forEach(btn => btn.addEventListener('click', async () => {
                if (confirm('删除后无法恢复，确定删除吗？')) {
                    await deleteVlog(btn.dataset.id);
                    await renderBackPage();
                    await renderFrontPage();
                }
            }));
        }
        // 上传逻辑
        const uploadBtn = document.getElementById('uploadBtn');
        const newTitle = document.getElementById('newTitle');
        const newVideo = document.getElementById('newVideo');
        const newCover = document.getElementById('newCover');
        const uploadMsg = document.getElementById('uploadMsg');
        uploadBtn?.addEventListener('click', async () => {
            const title = newTitle.value.trim();
            const videoFile = newVideo.files[0];
            if (!videoFile) { uploadMsg.innerText = '请选择视频文件'; return; }
            const coverFile = newCover.files[0] || null;
            uploadMsg.innerText = '上传中...';
            try {
                await addNewVlog(title || '未命名', videoFile, coverFile);
                uploadMsg.innerText = '✅ 上传成功！已置顶';
                newTitle.value = '';
                newVideo.value = '';
                newCover.value = '';
                await renderBackPage();
                await renderFrontPage();
            } catch (err) { uploadMsg.innerText = '❌ 上传失败'; console.error(err); }
        });
        document.getElementById('logoutBackBtn')?.addEventListener('click', () => {
            sessionStorage.removeItem('lamp_admin_auth');
            renderBackPage();
        });
    }

    // 编辑模态框 (更换视频/封面/标题)
    async function openEditModal(vlogId) {
        const tx = db.transaction(STORE_VLOGS, 'readonly');
        const store = tx.objectStore(STORE_VLOGS);
        const vlog = await new Promise(resolve => {
            const req = store.get(vlogId);
            req.onsuccess = () => resolve(req.result);
        });
        if (!vlog) return;
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-content">
                <h3 style="margin-bottom: 20px; color:#4a6243;">✏️ 编辑vlog</h3>
                <div class="input-group"><label>标题</label><input type="text" id="editTitle" value="${escapeHtml(vlog.title)}"></div>
                <div class="input-group"><label>更换视频 (可选)</label><input type="file" id="editVideo" accept="video/mp4"></div>
                <div class="input-group"><label>更换封面 (可选, 推荐16:9)</label><input type="file" id="editCover" accept="image/jpeg,image/png,image/webp"></div>
                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px;">
                    <button id="modalCancel" class="btn-soft">取消</button>
                    <button id="modalSave" class="btn-soft btn-primary">保存修改</button>
                </div>
                <div id="modalMsg" class="message" style="margin-top:12px;"></div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const saveBtn = document.getElementById('modalSave');
        const cancelBtn = document.getElementById('modalCancel');
        const editTitle = document.getElementById('editTitle');
        const editVideo = document.getElementById('editVideo');
        const editCover = document.getElementById('editCover');
        const modalMsg = document.getElementById('modalMsg');
        saveBtn.onclick = async () => {
            const newTitleVal = editTitle.value.trim() || vlog.title;
            let newVideoBlob = vlog.videoBlob;
            let newCoverBlob = vlog.coverBlob;
            if (editVideo.files.length > 0) {
                newVideoBlob = await fileToBlob(editVideo.files[0]);
            }
            if (editCover.files.length > 0) {
                newCoverBlob = await fileToBlob(editCover.files[0]);
            }
            try {
                await updateVlog(vlogId, {
                    title: newTitleVal,
                    videoBlob: newVideoBlob,
                    coverBlob: newCoverBlob
                });
                modalMsg.innerText = '保存成功！';
                setTimeout(() => {
                    modalDiv.remove();
                    renderBackPage();
                    renderFrontPage();
                }, 800);
            } catch (err) {
                modalMsg.innerText = '保存失败';
            }
        };
        cancelBtn.onclick = () => modalDiv.remove();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }

    // 页面切换
    let currentPage = 'front';
    async function showFrontPage() {
        if (currentPage === 'back' && sessionStorage.getItem('lamp_admin_auth') === 'authenticated') {
            sessionStorage.removeItem('lamp_admin_auth');
        }
        document.getElementById('frontPage')?.classList.remove('hidden-page');
        document.getElementById('backPage')?.classList.add('hidden-page');
        currentPage = 'front';
        await renderFrontPage();
    }
    async function showBackPage() {
        document.getElementById('frontPage')?.classList.add('hidden-page');
        document.getElementById('backPage')?.classList.remove('hidden-page');
        currentPage = 'back';
        await renderBackPage();
    }
    document.getElementById('gotoFrontBtn')?.addEventListener('click', showFrontPage);
    document.getElementById('gotoBackBtn')?.addEventListener('click', showBackPage);

    (async function init() {
        await openDB();
        await showFrontPage();
    })();
</script>
</body>
</html>
